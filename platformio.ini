; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; ayushsharma82/ElegantOTA@^3.1.7
; networking-for-arduino/EthernetESP32@^1.0.2
;
; default flash partition table (4MB): C:\Users\<user>\.platformio\packages\framework-arduinoespressif32\tools\partitions\default.csv

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
;upload_port = COM31
;monitor_port = COM31
;monitor_speed = 115200
;debug_tool = esp-builtin
;debug_init_break = break setup
;build_type = debug      ;build in debug mode instead of release mode
;build_unflags = 
;  -DARDUINO_USB_MODE
;  -DARDUINO_USB_CDC_ON_BOOT
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
;	-DCORE_DEBUG_LEVEL=1
lib_deps = 
	arduino-libraries/NTPClient@^3.2.1
	fastled/FastLED@^3.10.3
	marvinroger/AsyncMqttClient@^0.9.0
	256dpi/MQTT@^2.5.2
	
